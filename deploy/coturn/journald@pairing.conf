# /etc/systemd/journald@pairing.conf: the journal namespace coturn logs into (LogNamespace=pairing). coturn logs the addresses of clients and peers, so they are kept 7 days, apart from the server's other logs.
#
#   journalctl --namespace=pairing -u coturn

[Journal]
Storage=persistent
MaxRetentionSec=7day
SystemMaxUse=200M
