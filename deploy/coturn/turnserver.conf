# /etc/turnserver.conf: coturn as the TURN relay for the FrameTrail pairing broker.
#
# The self-hosted alternative to Cloudflare Realtime TURN (README, "Self-hosting TURN with coturn"). Written for coturn 4.6 or later; check it with deploy/coturn/test-local.sh before it goes to a server. Replace the <…> values. The secret is also the broker's TURN_SECRET:
#
#   openssl rand -base64 48
#
# install -m 640 -o root -g turnserver turnserver.conf /etc/turnserver.conf

# -- Listeners ----------------------------------------------------------------
# STUN and TURN on 3478 (UDP and TCP), TURN over TLS on 5349. Port 443 is taken by the web server on every address (README).
listening-port=3478
tls-listening-port=5349

# The server's public addresses, so coturn does not listen on loopback or on other internal interfaces. On a VPS whose public address sits on its own interface, external-ip is not needed.
listening-ip=<PUBLIC_IPV4>
relay-ip=<PUBLIC_IPV4>
# With IPv6 as well:
#listening-ip=<PUBLIC_IPV6>
#relay-ip=<PUBLIC_IPV6>

# The UDP ports relays use: one per allocation. A player answering 50 phones over udp, tcp and tls holds up to 150, each phone up to 3: one class needs about 300, so 1000 ports serve three at once (total-quota stays below).
min-port=50000
max-port=50999

# -- Authentication: the broker makes time-limited credentials ---------------
# username = <expiry>:<random>, credential = base64(HMAC-SHA1(secret, username))
use-auth-secret
static-auth-secret=<SECRET>
realm=<DOMAIN>
server-name=<DOMAIN>
fingerprint
stale-nonce=600

# -- TLS (1.2 or later) -------------------------------------------------------
# Copied from Plesk's Let's Encrypt certificate by coturn-cert.sh, which tells coturn to load the new one (SIGUSR2) after every renewal.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
# Browsers reach TURN over UDP, TCP or TLS, never DTLS.
no-dtls

# -- What the relay does ------------------------------------------------------
# Browsers ask only for UDP relays (RFC 6062 TCP relays are not for them).
no-tcp-relay
no-multicast-peers
# No NAT behaviour discovery and no classic-STUN answers: less to amplify.
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-cli

# Allocations at once: per username (a player keeps one for all its phones) and in all.
user-quota=200
total-quota=900
# Bytes per second per allocation (about 2 Mbit/s: a phone gets a few hundred bytes a second, and a hypervideo bundle once) and for all together.
max-bps=250000
bps-capacity=12500000

# Peers the relay never sends to: the private, loopback, link-local, CGNAT, documentation, benchmarking, multicast and reserved ranges, IPv4 and IPv6. The server's own public address stays allowed: two clients that both relay through this server reach each other over it. See README for what else then listens there (Plesk's DNS server).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::-::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# -- Log ----------------------------------------------------------------------
# To the journal (namespace "pairing", kept 7 days: coturn logs the addresses of clients and peers).
log-file=stdout
simple-log
