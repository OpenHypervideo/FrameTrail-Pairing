# /etc/systemd/system/coturn.service.d/frametrail.conf: additions to the coturn unit of the Debian/Ubuntu package.
#
#   systemctl daemon-reload && systemctl restart coturn
#   systemd-analyze security coturn

[Unit]
# coturn binds to the public addresses (listening-ip), which must be up, and needs its certificate in place.
Wants=network-online.target coturn-cert.service
After=network-online.target coturn-cert.service

[Service]
# coturn logs the addresses of clients and peers: into the journal namespace "pairing", kept 7 days (journald@pairing.conf):
#   journalctl --namespace=pairing -u coturn
LogNamespace=pairing
LimitNOFILE=65536

NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=-/var/lib/turn -/var/log/turnserver
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectHostname=yes
ProtectClock=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
