# Plesk → Websites & Domains → the broker's domain (e.g. pair.example.org) → Hosting & DNS → Apache & nginx Settings → "Additional directives for HTTPS": paste everything below, then OK. ("Additional directives for HTTP" stays empty: http redirects to https.)
#
# For a Plesk server whose web server is Apache alone (no nginx component). It needs Apache's proxy and proxy_http modules (Tools & Settings → Apache Web Server). With Plesk's nginx in front, use nginx-directives.conf instead.
#
# Only the broker's paths go to it; everything else stays Plesk's, among it /.well-known/acme-challenge/, which Let's Encrypt needs for renewals.
#
# Apache appends the client's address to X-Forwarded-For. The broker reads that header from 127.0.0.1 only (TRUSTED_PROXIES) and takes the rightmost address that is not a trusted proxy, so whatever a client writes into the header itself does not count.
#
# disablereuse=On: a new connection to the broker for every request (Node closes idle connections after 5 s, and Apache would otherwise now and then send a request into one that is closing). retry=0: after the broker restarts, Apache tries it again at once instead of answering 503 for a minute.

#
# No LimitRequestBody: Apache does not apply it to proxied requests. The broker refuses offers and answers over 64 KB itself (413) and gives a request at most 15 s.

ProxyPass "/ice" "http://127.0.0.1:8787/ice" connectiontimeout=2 timeout=10 retry=0 disablereuse=On
ProxyPass "/rooms/" "http://127.0.0.1:8787/rooms/" connectiontimeout=2 timeout=10 retry=0 disablereuse=On
