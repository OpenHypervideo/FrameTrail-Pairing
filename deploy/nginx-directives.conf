# Plesk → Websites & Domains → the broker's domain (e.g. pair.example.org) → Hosting & DNS → Apache & nginx Settings → "Additional nginx directives": paste everything below, then OK.
#
# For a Plesk server with its nginx component. Where Plesk runs Apache alone, use apache-directives.conf instead.
#
# Only the broker's paths go to it. Everything else stays Plesk's, among it /.well-known/acme-challenge/, which Let's Encrypt needs for renewals (a "location /" would also collide with the one Plesk writes itself).

location ~ ^/(ice|rooms/.*)$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    # The client's address, replacing whatever the client sent along: the broker believes these headers from 127.0.0.1 only (TRUSTED_PROXIES).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # Offers and answers are at most 64 KB.
    client_max_body_size 80k;

    # The paths hold room and phone ids; the broker logs what is needed, without them.
    access_log off;
}
